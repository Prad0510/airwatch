services:
  # ----------------------------------------------------
  # Hadoop HDFS NameNode
  # Web UI: http://localhost:9870
  # HDFS IPC: hdfs://namenode:9000
  # ----------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: airwatch-namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=airwatch-cluster
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./:/workspace

  # ----------------------------------------------------
  # Hadoop HDFS DataNode
  # Web UI: http://localhost:9864
  # ----------------------------------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: airwatch-datanode
    restart: always
    ports:
      - "9864:9864"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870"
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./:/workspace
    depends_on:
      - namenode

  # ----------------------------------------------------
  # Apache Spark Master
  # Web UI: http://localhost:8085
  # ----------------------------------------------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: airwatch-spark-master
    ports:
      - "8085:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - PATH=/spark/bin:/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYTHONPATH=/workspace
    volumes:
      - ./:/workspace
    depends_on:
      - namenode

  # ----------------------------------------------------
  # Apache Spark Worker
  # ----------------------------------------------------
  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: airwatch-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8086:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
      - PATH=/spark/bin:/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYTHONPATH=/workspace
    volumes:
      - ./:/workspace

  # ----------------------------------------------------
  # AirWatch Web Dashboard & Live Analytics Server
  # Web UI: http://localhost:8050
  # ----------------------------------------------------
  dashboard:
    image: python:3.10-slim
    container_name: airwatch-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      bash -c "pip install duckdb pandas pyarrow && python serve_dashboard.py --no-browser --port 8050"
    depends_on:
      - namenode
      - spark-master

volumes:
  hadoop_namenode:
  hadoop_datanode:
